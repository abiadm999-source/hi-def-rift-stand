<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rift Stand - Gameplay Locked Backup</title>
<style>
  html,body{margin:0;height:100%;background:#050607;color:#f7efe2;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none}
  .loading{font-weight:900;letter-spacing:.08em;text-align:center}.loading small{display:block;margin-top:10px;color:#75f4ff;letter-spacing:0;max-width:320px;line-height:1.4}
</style>
</head>
<body>
<div class="loading">RIFT STAND<small>gameplay locked backup loading...</small></div>
<script>
(async () => {
  const lockedBuild = "https://raw.githubusercontent.com/abiadm999-source/hi-def-rift-stand/22c638c4172a4ee1742838411d4a9fb519e56547/index.html";
  const html = await fetch(lockedBuild, { cache: "reload" }).then(r => {
    if (!r.ok) throw new Error("Could not load locked gameplay backup");
    return r.text();
  });
  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  document.body.innerHTML = `<div class="loading">RIFT STAND<small>${err.message}</small></div>`;
});
</script>
</body>
</html>
