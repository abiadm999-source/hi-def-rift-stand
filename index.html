<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rift Stand</title>
<style>
  html,body{margin:0;height:100%;background:#050607;color:#f7efe2;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none}
  .loading{font-weight:900;letter-spacing:.08em;text-align:center}.loading small{display:block;margin-top:10px;color:#75f4ff;letter-spacing:0}
</style>
</head>
<body>
<div class="loading">RIFT STAND<small>loading hi-def build...</small></div>
<script>
(async () => {
  const source = "https://raw.githubusercontent.com/abiadm999-source/hi-def-rift-stand/e6e5911d1e427b44ba81829af9c2b6dbc2c50769/index.html";
  let html = await fetch(source, { cache: "reload" }).then(r => {
    if (!r.ok) throw new Error("Could not load Rift Stand build");
    return r.text();
  });
  const replace = (pattern, value, label) => {
    const next = html.replace(pattern, value);
    if (next === html) console.warn(`Rift Stand patch missed: ${label}`);
    html = next;
  };

  replace(/shieldDuration:\s*\d+/, "shieldDuration: 20", "shield duration");

  replace(`  group.scale.set(zombie ? (boss ? 1.12 : 1.1) : 1.15, zombie ? 1.02 : 1.03, 1);
  const armColor = zombie ? (boss ? 0x9b7762 : kind === "runner" ? 0x85886c : 0x8e9672) : 0x1b3552;
  const forearmColor = zombie ? (boss ? 0xa68569 : kind === "runner" ? 0x9b8a78 : 0xa0a880) : 0x13263d;
  const handColor = zombie ? (boss ? 0xaa846b : 0xa8ad83) : 0xd08b5c;
  const legColor = zombie ? (boss ? 0x352d28 : 0x353831) : 0x0d1520;
  const bodyColor = zombie ? (boss ? 0x9a7460 : kind === "runner" ? 0x8d9271 : kind === "brute" ? 0x8f9470 : 0x929a74) : 0x203d5f;
  const shirtColor = zombie ? (boss ? 0x4a372e : kind === "runner" ? 0x653c49 : kind === "brute" ? 0x524a3a : 0x4e5644) : 0xf0b531;`, `  group.scale.set(zombie ? (boss ? 1.18 : 1.16) : 1.22, zombie ? 1.05 : 1.06, 1);
  const armColor = zombie ? (boss ? 0xb48970 : kind === "runner" ? 0x9b9675 : 0xa3ad7b) : 0x244f78;
  const forearmColor = zombie ? (boss ? 0xc39a78 : kind === "runner" ? 0xac947d : 0xb5bb8a) : 0x1a395d;
  const handColor = zombie ? (boss ? 0xc79776 : 0xbec48f) : 0xd8925d;
  const legColor = zombie ? (boss ? 0x3f332b : 0x41443a) : 0x111d2a;
  const bodyColor = zombie ? (boss ? 0xb1866e : kind === "runner" ? 0x9da176 : kind === "brute" ? 0xa0a679 : 0xa6b07f) : 0x25537f;
  const shirtColor = zombie ? (boss ? 0x5a4034 : kind === "runner" ? 0x744556 : kind === "brute" ? 0x625745 : 0x5a654c) : 0xf6bf35;`, "visual palette");

  replace(`  const legH = boss ? 1.28 : zombie ? 1.16 : 1.26;
  const upperH = boss ? .8 : zombie ? .72 : .68;
  const foreH = boss ? .74 : zombie ? .7 : .64;
  const upperW = boss ? .44 : zombie ? .38 : .4;
  const foreW = boss ? .38 : zombie ? .34 : .34;
  const handSize = boss ? .48 : zombie ? .42 : .4;
  const legW = boss ? .5 : zombie ? .43 : .48;`, `  const legH = boss ? 1.32 : zombie ? 1.2 : 1.28;
  const upperH = boss ? .84 : zombie ? .76 : .7;
  const foreH = boss ? .78 : zombie ? .74 : .66;
  const upperW = boss ? .52 : zombie ? .46 : .46;
  const foreW = boss ? .46 : zombie ? .41 : .38;
  const handSize = boss ? .56 : zombie ? .48 : .43;
  const legW = boss ? .58 : zombie ? .5 : .52;`, "chunkier limbs");

  replace(`    rig.outline = makeWalkBodyPiece("playerTorso", 0x02070c, 2.02, 1.86, .7);
    rig.torso = makeWalkBodyPiece("playerTorso", 0x203d5f, 1.72, 1.7, .99);
    rig.chest = makeWalkBodyPiece("playerChest", 0xf0b531, 1.82, .84, .99);
    rig.rim = makeWalkBodyPiece("playerChest", 0x77f4ff, 1.86, .16, .86);
    rig.belt = makeWalkBodyPiece("playerBelt", 0x060910, 1.42, .34, .99);
    rig.head = makeWalkBodyPiece("playerHead", 0xd08b5c, .78, .84, .99);
    rig.hair = makeWalkBodyPiece("playerHair", 0x110b08, .84, .42, .99);
    rig.crown = makeWalkBodyPiece("playerCrown", 0xffd34d, .66, .44, .99);
    rig.lBoot = makeWalkBodyPiece("playerBoot", 0x101922, .68, .44, .99);
    rig.rBoot = makeWalkBodyPiece("playerBoot", 0x101922, .68, .44, .99);`, `    rig.outline = makeWalkBodyPiece("playerTorso", 0x02070c, 2.24, 1.96, .74);
    rig.torso = makeWalkBodyPiece("playerTorso", 0x25537f, 1.96, 1.78, .99);
    rig.chest = makeWalkBodyPiece("playerChest", 0xf6bf35, 2.02, .92, .99);
    rig.rim = makeWalkBodyPiece("playerChest", 0x77f4ff, 2.02, .18, .9);
    rig.belt = makeWalkBodyPiece("playerBelt", 0x060910, 1.55, .38, .99);
    rig.head = makeWalkBodyPiece("playerHead", 0xd8925d, .86, .92, .99);
    rig.hair = makeWalkBodyPiece("playerHair", 0x110b08, .9, .46, .99);
    rig.crown = makeWalkBodyPiece("playerCrown", 0xffd34d, .78, .28, .92);
    rig.lBoot = makeWalkBodyPiece("playerBoot", 0x101922, .76, .48, .99);
    rig.rBoot = makeWalkBodyPiece("playerBoot", 0x101922, .76, .48, .99);`, "chunkier player");

  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  document.body.innerHTML = `<div class="loading">RIFT STAND<small>${err.message}</small></div>`;
});
</script>
</body>
</html>
